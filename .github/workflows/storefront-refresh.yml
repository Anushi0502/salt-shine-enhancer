name: SALT Storefront Refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salt-storefront-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout storefront source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Shopify theme source
        uses: actions/checkout@v4
        with:
          repository: Anushi0502/salt-online-store-v2
          ref: main
          token: ${{ secrets.SALT_THEME_REPO_TOKEN }}
          path: salt-online-store-shopify

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot current generated data
        run: cp -R public/data "$RUNNER_TEMP/salt-data-before"

      - name: Sync live Shopify catalog and collections
        env:
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_ADMIN_API_VERSION: "2026-07"
          SALT_SHOP_URL: https://0309d3-72.myshopify.com
          SALT_SHOPIFY_SKIP_PRODUCT_ENRICHMENT: "1"
        run: npm run sync:data

      - name: Detect meaningful catalog changes
        id: catalog
        run: node scripts/compare-generated-data.mjs "$RUNNER_TEMP/salt-data-before" public/data >> "$GITHUB_OUTPUT"

      - name: Build web and Shopify assets
        if: steps.catalog.outputs.changed == 'true'
        env:
          SHOPIFY_THEME_DIR: ${{ github.workspace }}/salt-online-store-shopify
        run: npm run build:web && npm run theme:bundle

      - name: Commit refreshed source data
        if: steps.catalog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "Scheduled Shopify catalog refresh"
            git push origin HEAD:main
          fi

      - name: Commit refreshed Shopify theme bundle
        if: steps.catalog.outputs.changed == 'true'
        run: |
          git -C salt-online-store-shopify config user.name "github-actions[bot]"
          git -C salt-online-store-shopify config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C salt-online-store-shopify add -A
          if git -C salt-online-store-shopify diff --cached --quiet; then
            echo "No Shopify theme source changes to commit."
          else
            git -C salt-online-store-shopify commit -m "Scheduled Shopify catalog refresh"
            git -C salt-online-store-shopify push origin HEAD:main
          fi

      - name: Publish active Shopify theme
        if: steps.catalog.outputs.changed == 'true'
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_ACCESS_PASSWORD }}
        run: |
          npx --yes @shopify/cli@4.5.2 theme push \
            --path "$GITHUB_WORKSPACE/salt-online-store-shopify" \
            --store 0309d3-72.myshopify.com \
            --theme 141589774435 \
            --allow-live \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --json

      - name: Report no-op refresh
        if: steps.catalog.outputs.changed != 'true'
        run: echo "Catalog content unchanged; no theme upload was needed."
