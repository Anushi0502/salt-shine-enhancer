name: Configure SALT Finance Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout storefront source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@54.16.0

      - name: Configure and deploy finance runtime
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
        run: |
          vercel link --yes --scope gcs1124s-projects --project salt-online-store_v2 --token "$VERCEL_TOKEN"
          vercel env add SHOPIFY_ADMIN_ACCESS_TOKEN production \
            --scope gcs1124s-projects \
            --token "$VERCEL_TOKEN" \
            --value "$SHOPIFY_ADMIN_ACCESS_TOKEN" \
            --sensitive --force --yes
          vercel --prod --yes --scope gcs1124s-projects --token "$VERCEL_TOKEN"
