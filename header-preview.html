<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Salt Online Store Header Demo</title>
    <style>
      :root {
        --bg: #ecf4fc;
        --highlight: #d0e4fc;
        --navy: #0c2048;
        --text: #102a43;
        --white: #ffffff;
        --border: #bfd7f2;
        --soft-shadow: 0 18px 36px -28px rgba(12, 32, 72, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(208, 228, 252, 0.45), transparent 35%),
          linear-gradient(180deg, #f7fbff 0%, #eef5fd 100%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid var(--border);
        background: rgba(236, 244, 252, 0.96);
        box-shadow: var(--soft-shadow);
        backdrop-filter: blur(14px);
      }

      .header__top {
        margin: 0 auto;
        display: flex;
        max-width: 1280px;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px 12px;
      }

      .brand-row {
        order: 1;
        display: flex;
        min-width: 0;
        flex: 1 1 auto;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand-link {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
        border-radius: 999px;
        padding: 4px 10px 4px 4px;
        transition: transform 180ms ease, background-color 180ms ease;
      }

      .brand-link:hover {
        background: rgba(255, 255, 255, 0.72);
        transform: translateY(-1px);
      }

      .salt-mark {
        display: grid;
        width: 44px;
        height: 44px;
        flex: none;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 24px -18px rgba(12, 32, 72, 0.3);
      }

      .wordmark {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 1.02rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--text);
      }

      .location-pill {
        display: none;
        height: 44px;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        padding: 0 16px;
        box-shadow: 0 10px 24px -18px rgba(12, 32, 72, 0.18);
        transition: transform 180ms ease, background-color 180ms ease;
      }

      .location-pill:hover {
        background: rgba(255, 255, 255, 0.95);
        transform: translateY(-1px);
      }

      .location-pill__text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .location-pill__small {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #5c748f;
      }

      .location-pill__big {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text);
      }

      .actions {
        order: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }

      .icon-button,
      .text-button,
      .search-button,
      .category-button,
      .nav-link {
        transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease,
          color 180ms ease;
      }

      .icon-button:hover,
      .text-button:hover,
      .search-button:hover,
      .category-button:hover,
      .nav-link:hover {
        transform: translateY(-1px);
      }

      .lang-button {
        display: none;
        align-items: center;
        gap: 8px;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        padding: 0 14px;
        color: var(--text);
        font-size: 0.88rem;
        font-weight: 700;
        box-shadow: 0 8px 18px -18px rgba(12, 32, 72, 0.25);
      }

      .account-link,
      .orders-link {
        display: none;
        min-width: 0;
        padding: 8px 14px;
        border-radius: 999px;
        text-align: left;
        transition: background-color 180ms ease, transform 180ms ease;
      }

      .account-link:hover,
      .orders-link:hover {
        background: rgba(255, 255, 255, 0.68);
        transform: translateY(-1px);
      }

      .link-small {
        display: block;
        font-size: 0.62rem;
        font-weight: 600;
        line-height: 1;
        color: #5c748f;
      }

      .link-big {
        display: block;
        font-size: 0.92rem;
        font-weight: 700;
        line-height: 1.1;
        color: var(--text);
      }

      .cart-button {
        position: relative;
        display: inline-flex;
        height: 44px;
        width: 44px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--navy);
        box-shadow: 0 8px 18px -18px rgba(12, 32, 72, 0.25);
      }

      .cart-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        display: grid;
        min-width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 999px;
        background: var(--navy);
        color: var(--white);
        font-size: 0.66rem;
        font-weight: 800;
        padding: 0 5px;
      }

      .search-row {
        order: 3;
        flex-basis: 100%;
      }

      .search-shell {
        position: relative;
        display: flex;
        overflow: visible;
        height: 52px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--white);
        box-shadow: 0 14px 30px -26px rgba(12, 32, 72, 0.35);
      }

      .category-wrap {
        position: relative;
        flex: none;
      }

      .category-button {
        display: flex;
        height: 100%;
        min-width: 110px;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 0;
        border-right: 1px solid var(--border);
        border-radius: 999px 0 0 999px;
        background: var(--highlight);
        color: var(--navy);
        padding: 0 14px;
        font-weight: 700;
      }

      .category-button__label {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .category-menu {
        position: absolute;
        left: 0;
        top: calc(100% + 10px);
        z-index: 30;
        display: none;
        width: min(320px, calc(100vw - 24px));
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--white);
        padding: 8px;
        box-shadow: 0 20px 40px -28px rgba(12, 32, 72, 0.3);
      }

      .category-menu.open {
        display: block;
      }

      .category-option {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--text);
        padding: 10px 12px;
        text-align: left;
        transition: background-color 180ms ease, transform 180ms ease;
      }

      .category-option:hover {
        background: #ecf4fc;
        transform: translateY(-1px);
      }

      .category-option.active {
        background: var(--highlight);
        color: var(--navy);
        font-weight: 700;
      }

      .search-input-wrap {
        position: relative;
        display: flex;
        min-width: 0;
        flex: 1 1 auto;
        align-items: center;
      }

      .search-input {
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        padding: 0 14px 0 40px;
        color: var(--text);
        outline: none;
      }

      .search-input::placeholder {
        color: #7a94b1;
      }

      .search-icon,
      .control-icon {
        pointer-events: none;
        flex: none;
      }

      .search-icon {
        position: absolute;
        left: 14px;
        width: 16px;
        height: 16px;
        color: #5c748f;
      }

      .search-button {
        display: inline-flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 0 999px 999px 0;
        background: var(--navy);
        color: var(--white);
        padding: 0 18px;
        font-weight: 700;
      }

      .secondary-nav {
        border-top: 1px solid var(--border);
        background: var(--navy);
      }

      .secondary-nav__inner {
        margin: 0 auto;
        display: flex;
        max-width: 1280px;
        gap: 10px;
        overflow-x: auto;
        padding: 10px 16px;
        scrollbar-width: none;
      }

      .secondary-nav__inner::-webkit-scrollbar {
        display: none;
      }

      .nav-link {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.92);
        padding: 10px 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .nav-link:hover,
      .nav-link.active {
        border-color: var(--highlight);
        background: var(--highlight);
        color: var(--navy);
      }

      .nav-link .control-icon {
        width: 16px;
        height: 16px;
      }

      .demo-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .demo-card {
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.72);
        padding: 20px 22px;
        box-shadow: 0 18px 36px -30px rgba(12, 32, 72, 0.2);
      }

      .demo-card h1 {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 2.6vw, 2rem);
        line-height: 1.1;
        color: var(--navy);
      }

      .demo-card p {
        margin: 0;
        line-height: 1.6;
      }

      .demo-status {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        background: var(--highlight);
        padding: 10px 14px;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--navy);
      }

      @media (min-width: 768px) {
        .location-pill {
          display: inline-flex;
        }

        .lang-button {
          display: inline-flex;
        }

        .account-link,
        .orders-link {
          display: inline-block;
        }

        .search-row {
          order: 2;
          flex: 1 1 0;
          min-width: 0;
        }

        .actions {
          order: 3;
        }

        .search-shell {
          height: 54px;
        }

        .category-button {
          min-width: 170px;
        }
      }

      @media (max-width: 767px) {
        .search-button .search-button__label {
          display: none;
        }

        .brand-row {
          align-items: center;
        }
      }

      @media (max-width: 420px) {
        .lang-button {
          display: none;
        }

        .category-button {
          min-width: 78px;
          padding: 0 10px;
          font-size: 0.82rem;
        }

        .search-button {
          padding: 0 12px;
        }

        .wordmark {
          font-size: 0.96rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <div class="brand-row">
          <a class="brand-link" href="#" aria-label="Salt Online Store">
            <span class="salt-mark" aria-hidden="true">
              <svg viewBox="0 0 56 56" width="34" height="34" focusable="false" aria-hidden="true">
                <defs>
                  <linearGradient id="salt-bag-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF"></stop>
                    <stop offset="100%" stop-color="#D0E4FC"></stop>
                  </linearGradient>
                </defs>
                <path
                  d="M16.5 18.5c0-3.6 2.9-6.5 6.5-6.5h10c3.6 0 6.5 2.9 6.5 6.5v1.8c0 1.2-.6 2.4-1.6 3.1l-1.7 1.2c2.4 2.1 3.8 5.1 3.8 8.3v7.4c0 4.8-3.9 8.7-8.7 8.7h-7.8c-4.8 0-8.7-3.9-8.7-8.7v-7.4c0-3.2 1.4-6.2 3.8-8.3l-1.7-1.2c-1-.7-1.6-1.9-1.6-3.1v-1.8Z"
                  fill="url(#salt-bag-gradient)"
                  stroke="#0C2048"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                ></path>
                <path d="M22 16.5h12" stroke="#0C2048" stroke-width="1.8" stroke-linecap="round"></path>
                <path
                  d="M20.4 32.2l4.2-4.2 4.2 4.2 4.2-4.2 4.2 4.2"
                  fill="none"
                  stroke="#0C2048"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M23.2 23.5l2-2 2 2-2 2-2-2Zm8.4 0l2-2 2 2-2 2-2-2Z"
                  fill="#ECF4FC"
                  stroke="#0C2048"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </span>
            <span class="wordmark">Salt Online Store</span>
          </a>

          <button class="location-pill" type="button" aria-label="Deliver to India">
            <svg class="control-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M12 21s6-5.7 6-11a6 6 0 0 0-12 0c0 5.3 6 11 6 11Z"
                fill="none"
                stroke="#0C2048"
                stroke-width="1.8"
              ></path>
              <circle cx="12" cy="10" r="2.2" fill="#0C2048"></circle>
            </svg>
            <span class="location-pill__text">
              <span class="location-pill__small">Deliver to</span>
              <span class="location-pill__big">India</span>
            </span>
          </button>

          <div class="actions">
            <button class="icon-button lang-button" type="button" aria-label="Language EN">
              <svg class="control-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Zm0 0c2.3 2.1 3.8 4.9 3.8 9S14.3 18.9 12 21m0-18c-2.3 2.1-3.8 4.9-3.8 9S9.7 18.9 12 21M3 12h18"
                  fill="none"
                  stroke="#0C2048"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span>EN</span>
            </button>

            <a class="account-link" href="#" aria-label="Hello, sign in / Account & Lists">
              <span class="link-small">Hello, sign in</span>
              <span class="link-big">Account & Lists</span>
            </a>

            <a class="orders-link" href="#" aria-label="Returns / & Orders">
              <span class="link-small">Returns</span>
              <span class="link-big">& Orders</span>
            </a>

            <button class="cart-button" type="button" aria-label="Cart with 3 items" id="cart-button">
              <svg class="control-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  d="M6 7h15l-1.5 8.5H8.3L6 7ZM6 7 5.2 4H2"
                  fill="none"
                  stroke="#0C2048"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <circle cx="9" cy="19" r="1.5" fill="#0C2048"></circle>
                <circle cx="17" cy="19" r="1.5" fill="#0C2048"></circle>
              </svg>
              <span class="cart-badge">3</span>
            </button>
          </div>
        </div>

        <form class="search-row" id="search-form">
          <div class="search-shell">
            <div class="category-wrap">
              <button
                class="category-button"
                type="button"
                id="category-button"
                aria-label="Search category All"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="category-button__label" id="category-label">All</span>
                <svg class="control-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path
                    d="M6 9l6 6 6-6"
                    fill="none"
                    stroke="#0C2048"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </button>

              <div class="category-menu" id="category-menu" role="listbox" aria-label="Search categories"></div>
            </div>

            <label class="search-input-wrap">
              <span class="sr-only">Search Salt Online Store</span>
              <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  d="M11 18a7 7 0 1 0-7-7 7 7 0 0 0 7 7Zm0 0 4.7 4.7"
                  fill="none"
                  stroke="#5C748F"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <input
                class="search-input"
                id="search-input"
                type="search"
                placeholder="Search Salt Online Store"
                autocomplete="off"
              />
            </label>

            <button class="search-button" type="submit">
              <svg class="control-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path
                  d="M11 18a7 7 0 1 0-7-7 7 7 0 0 0 7 7Zm0 0 4.7 4.7"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span class="search-button__label">Search</span>
            </button>
          </div>
        </form>
      </div>

      <div class="secondary-nav">
        <nav class="secondary-nav__inner" id="secondary-nav" aria-label="Secondary navigation"></nav>
      </div>
    </header>

    <main class="demo-content">
      <section class="demo-card">
        <h1>Standalone Header Demo</h1>
        <p>
          This page is pure HTML, CSS, and vanilla JavaScript. Use it to review the responsive
          header without loading the full React app.
        </p>
        <div class="demo-status" id="demo-status">Try the category menu, search bar, and nav links.</div>
      </section>
    </main>

    <script>
      const categories = ["All", "Himalayan Salt", "Rock Salt", "Sea Salt", "Black Salt"];
      const secondaryNav = [
        { label: "All", href: "#all", icon: "menu", active: true },
        { label: "Today's Deals", href: "#deals" },
        { label: "Himalayan Salt", href: "#himalayan-salt" },
        { label: "Rock Salt", href: "#rock-salt" },
        { label: "Sea Salt", href: "#sea-salt" },
        { label: "Black Salt", href: "#black-salt" },
        { label: "Bulk Orders", href: "#bulk-orders" },
        { label: "Customer Service", href: "#customer-service" },
      ];

      const header = document.querySelector(".header");
      const categoryButton = document.getElementById("category-button");
      const categoryLabel = document.getElementById("category-label");
      const categoryMenu = document.getElementById("category-menu");
      const searchForm = document.getElementById("search-form");
      const searchInput = document.getElementById("search-input");
      const secondaryNavRoot = document.getElementById("secondary-nav");
      const demoStatus = document.getElementById("demo-status");
      const cartButton = document.getElementById("cart-button");

      let selectedCategory = "All";
      let categoryOpen = false;

      function setStatus(message) {
        demoStatus.textContent = message;
      }

      function closeCategoryMenu() {
        categoryOpen = false;
        categoryButton.setAttribute("aria-expanded", "false");
        categoryMenu.classList.remove("open");
      }

      function openCategoryMenu() {
        categoryOpen = true;
        categoryButton.setAttribute("aria-expanded", "true");
        categoryMenu.classList.add("open");
      }

      function toggleCategoryMenu() {
        if (categoryOpen) {
          closeCategoryMenu();
        } else {
          openCategoryMenu();
        }
      }

      function selectCategory(value) {
        selectedCategory = value;
        categoryLabel.textContent = value;
        categoryButton.setAttribute("aria-label", `Search category ${value}`);
        setStatus(`Category selected: ${value}`);
        closeCategoryMenu();
      }

      function renderCategoryMenu() {
        categoryMenu.innerHTML = categories
          .map(
            (option) => `
              <button
                type="button"
                class="category-option ${option === selectedCategory ? "active" : ""}"
                role="option"
                aria-selected="${option === selectedCategory}"
                data-category-option="${option}"
              >
                <span>${option}</span>
                ${option === selectedCategory ? '<span style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;">Selected</span>' : ""}
              </button>
            `,
          )
          .join("");
      }

      function renderSecondaryNav() {
        secondaryNavRoot.innerHTML = secondaryNav
          .map(
            (item) => `
              <a
                class="nav-link ${item.active ? "active" : ""}"
                href="${item.href}"
                data-nav-link="${item.label}"
              >
                ${item.label === "All" ? `
                  <svg class="control-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path
                      d="M4 6h16M4 12h16M4 18h16"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"
                      stroke-linecap="round"
                    ></path>
                  </svg>
                ` : ""}
                <span>${item.label}</span>
              </a>
            `,
          )
          .join("");
      }

      categoryButton.addEventListener("click", toggleCategoryMenu);

      categoryMenu.addEventListener("click", (event) => {
        const option = event.target.closest("[data-category-option]");
        if (!option) {
          return;
        }

        selectCategory(option.getAttribute("data-category-option"));
        renderCategoryMenu();
      });

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();
        const params = new URLSearchParams();

        if (query) {
          params.set("q", query);
        }

        if (selectedCategory !== "All") {
          params.set("category", selectedCategory);
        }

        const target = params.toString() ? `/search?${params.toString()}` : "/search";
        setStatus(`Search requested: ${target}`);
      });

      cartButton.addEventListener("click", () => {
        setStatus("Cart opened with 3 items in the badge.");
      });

      secondaryNavRoot.addEventListener("click", (event) => {
        const link = event.target.closest("[data-nav-link]");
        if (!link) {
          return;
        }

        event.preventDefault();
        setStatus(`Navigation clicked: ${link.getAttribute("data-nav-link")}`);
      });

      document.addEventListener("click", (event) => {
        if (!header.contains(event.target)) {
          closeCategoryMenu();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeCategoryMenu();
        }
      });

      renderCategoryMenu();
      renderSecondaryNav();
    </script>
  </body>
</html>
